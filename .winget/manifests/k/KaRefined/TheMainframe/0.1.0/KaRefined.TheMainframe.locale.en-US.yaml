ShortDescription: A private, local-first life management app for desktop and Android.
Description: |-
  The Mainframe is a calm, local-first personal operating system for everything you're
  learning, building, pursuing, and acquiring. It provides five pre-modeled life domains
  — Courses, Goals, Build Ideas, Ventures, and Acquisitions — with zero configuration,
  no-shame re-entry, and 100% offline-first SQLite storage.

  Key features:
  - 100% offline-first: all data stored locally in SQLite (no cloud account required)
  - Five pre-modeled life domains: Courses, Goals, Ideas, Ventures, Acquisitions
  - No-shame Neuro-UX: neutral re-entry design, no punitive overdue badges
  - Peer-to-peer device sync over LAN Wi-Fi or USB (no central server)
  - Built with Tauri v2 (Rust + React + TypeScript)
  - Free and open source (MIT License)
  - Available for Windows, macOS, Linux, and Android
