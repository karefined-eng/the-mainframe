name: Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SIGNING_ENABLED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure release signing
        if: env.SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/mainframe-upload-keystore.jks
          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/src-tauri/gen/android/mainframe-upload-keystore.jks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      - name: Build signed Android release APK
        if: env.SIGNING_ENABLED == 'true'
        run: npm run tauri android build -- --release --apk --target aarch64

      - name: Build unsigned Android debug APK
        if: env.SIGNING_ENABLED != 'true'
        run: npm run tauri android build -- --debug --target aarch64

      - name: Upload signed release APK
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mainframe-android-release-aarch64
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/release/*-release.apk

      - name: Upload unsigned debug APK
        if: env.SIGNING_ENABLED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mainframe-android-debug-aarch64
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/debug/*-debug.apk

      - name: Remove signing material
        if: always() && env.SIGNING_ENABLED == 'true'
        shell: bash
        run: rm -f src-tauri/gen/android/keystore.properties src-tauri/gen/android/mainframe-upload-keystore.jks
