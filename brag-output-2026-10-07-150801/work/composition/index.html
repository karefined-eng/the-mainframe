<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>The Mainframe — landing page brag</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Local fonts — the project's own @fontsource files. */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0e0e10;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e0e10;
        color: #f2f2f0;
        font-family: "Inter", system-ui, sans-serif;
      }
      .mono {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .scene-inner {
        position: absolute;
        inset: 0;
      }
      .page-shot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* Scene 1 — hook */
      .s1-kicker {
        position: absolute;
        left: 140px;
        top: 460px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 30px;
        color: #b1b3b7;
      }
      .s1-kicker span {
        display: inline-block;
        margin-right: 0.42em;
      }
      .s1-statement {
        position: absolute;
        left: 140px;
        top: 540px;
        font-size: 76px;
        font-weight: 700;
        letter-spacing: -0.026em;
        color: #f2f2f0;
        white-space: nowrap;
      }

      /* Scene 2 — the section (real page) */
      .s2-caption {
        position: absolute;
        right: 140px;
        top: 420px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 30px;
        font-weight: 500;
        color: #f2f2f0;
        text-align: right;
      }

      /* Scene 3 — the voice */
      .s3-quote1 {
        position: absolute;
        left: 140px;
        top: 360px;
        font-size: 92px;
        font-weight: 700;
        letter-spacing: -0.026em;
        color: #f2f2f0;
        white-space: nowrap;
      }
      .s3-quote2 {
        position: absolute;
        left: 140px;
        top: 484px;
        font-size: 92px;
        font-weight: 700;
        letter-spacing: -0.026em;
        color: #b1b3b7;
        white-space: nowrap;
      }

      /* Scene 4 — punchline */
      .s4-kicker {
        position: absolute;
        left: 140px;
        top: 300px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 30px;
        color: #b1b3b7;
      }
      .s4-line1 {
        position: absolute;
        left: 140px;
        top: 372px;
        font-size: 112px;
        font-weight: 700;
        letter-spacing: -0.026em;
        color: #f2f2f0;
        white-space: nowrap;
      }
      .s4-line2 {
        position: absolute;
        left: 140px;
        top: 514px;
        font-size: 112px;
        font-weight: 700;
        letter-spacing: -0.026em;
        color: #f2f2f0;
        white-space: nowrap;
      }
      .s4-lockup {
        position: absolute;
        left: 140px;
        top: 396px;
        display: flex;
        align-items: flex-start;
        gap: 36px;
      }
      .s4-mark {
        width: 110px;
        height: 110px;
        flex: none;
      }
      .s4-name {
        font-size: 52px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #f2f2f0;
        margin-top: 8px;
      }
      .s4-url {
        margin-top: 26px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 30px;
        color: #f2f2f0;
      }
      .s4-pill {
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border: 2px solid #1f2024;
        border-radius: 999px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 24px;
        color: #b1b3b7;
        white-space: nowrap;
      }
      .s4-pill-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #4a9eff;
        flex: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20.5"
      data-width="1920"
      data-height="1080"
    >
      <audio
        id="music"
        src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"
        data-start="0"
        data-duration="20.5"
        data-track-index="10"
        data-volume="0.15"
        data-fade-in="1.5"
        data-fade-out="2.2"
      ></audio>

      <!-- Scene 1 — Hook (0 – 3.0) -->
      <section id="s1" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="s1-inner" class="scene-inner">
          <div class="s1-kicker mono"
            ><span>most</span><span>landing</span><span>pages</span><span>oversell.</span></div
          >
          <div id="s1-statement" class="s1-statement">This one has a section called</div>
        </div>
      </section>

      <!-- Scene 2 — The section (2.8 – 8.2) -->
      <section id="s2" class="clip" data-start="2.8" data-duration="5.4" data-track-index="1">
        <div id="s2-inner" class="scene-inner">
          <div id="s2-shot-wrap" style="position: absolute; inset: 0">
            <img
              class="page-shot"
              src="assets/pages/honesty.png"
              alt="The real landing page: platform table, build instructions, and the section titled What it will not do, and what you should know"
            />
          </div>
          <div id="s2-caption" class="s2-caption">on the marketing page.</div>
        </div>
      </section>

      <!-- Scene 3 — The voice (7.8 – 15.7) -->
      <section id="s3" class="clip" data-start="7.8" data-duration="7.9" data-track-index="2">
        <div id="s3-inner" class="scene-inner">
          <div id="s3-quote1" class="s3-quote1">Four things it does.</div>
          <div id="s3-quote2" class="s3-quote2">And nothing else.</div>
          <div id="s3-card1-wrap" style="position: absolute; inset: 0">
            <img
              class="page-shot"
              src="assets/pages/platforms.png"
              alt="The real landing page: What you can actually run today, with the platform table and Open the Actions tab button"
            />
          </div>
          <div id="s3-card2-wrap" style="position: absolute; inset: 0">
            <img
              class="page-shot"
              src="assets/pages/hero.png"
              alt="The real landing page hero: A local-first home for every list you are already keeping"
            />
          </div>
        </div>
      </section>

      <!-- Scene 4 — Punchline (15.3 – 20.5) -->
      <section id="s4" class="clip" data-start="15.3" data-duration="5.2" data-track-index="3">
        <div id="s4-inner" class="scene-inner">
          <div id="s4-kicker" class="s4-kicker mono">the closing section is titled</div>
          <div id="s4-line1" class="s4-line1" data-layout-allow-overlap>Read the code</div>
          <div id="s4-line2" class="s4-line2" data-layout-allow-overlap>before you trust it.</div>
          <div id="s4-lockup" class="s4-lockup" data-layout-allow-overlap>
            <img id="s4-mark" class="s4-mark" src="assets/logo.svg" alt="The Mainframe mark" />
            <div>
              <div id="s4-name" class="s4-name">The Mainframe</div>
              <div id="s4-url" class="s4-url mono">the-mainframe-app.vercel.app</div>
              <div id="s4-pill" class="s4-pill"
                ><span class="s4-pill-dot"></span>Early public release · no versioned releases
                yet</span
              >
            </div>
          </div>
        </div>
      </section>

      <!-- SFX: scene 1 typing (deterministic file sequence) -->
      <audio id="key-01" src="assets/sfx/keyboard/keypress-001.wav" data-start="0.34" data-duration="0.25" data-track-index="11" data-volume="0.28"></audio>
      <audio id="key-02" src="assets/sfx/keyboard/keypress-004.wav" data-start="0.52" data-duration="0.25" data-track-index="12" data-volume="0.28"></audio>
      <audio id="key-03" src="assets/sfx/keyboard/keypress-002.wav" data-start="0.7" data-duration="0.25" data-track-index="13" data-volume="0.28"></audio>
      <audio id="key-04" src="assets/sfx/keyboard/keypress-005.wav" data-start="0.88" data-duration="0.25" data-track-index="14" data-volume="0.28"></audio>

      <!-- SFX: scene 3 quote drops + card cuts -->
      <audio id="sfx-quote1" src="assets/sfx/interface/drop_001.ogg" data-start="8.7" data-duration="0.11" data-track-index="16" data-volume="0.42"></audio>
      <audio id="sfx-quote2" src="assets/sfx/interface/drop_002.ogg" data-start="9.9" data-duration="0.19" data-track-index="17" data-volume="0.42"></audio>
      <audio id="sfx-card1" src="assets/sfx/interface/click_002.ogg" data-start="10.9" data-duration="0.01" data-track-index="18" data-volume="0.38"></audio>
      <audio id="sfx-card2" src="assets/sfx/interface/click_002.ogg" data-start="13.1" data-duration="0.01" data-track-index="19" data-volume="0.38"></audio>

      <!-- SFX: scene 4 lines + dry logo hit -->
      <audio id="sfx-line1" src="assets/sfx/interface/drop_001.ogg" data-start="17.47" data-duration="0.11" data-track-index="20" data-volume="0.42"></audio>
      <audio id="sfx-line2" src="assets/sfx/interface/drop_002.ogg" data-start="18.56" data-duration="0.19" data-track-index="21" data-volume="0.42"></audio>
      <audio id="sfx-logo" src="assets/sfx/impact/impactSoft_medium_000.ogg" data-start="19.66" data-duration="0.12" data-track-index="22" data-volume="0.55"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      /* ── Scene 1 — Hook ─────────────────────────────────── */
      tl.fromTo(
        ".s1-kicker span",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.2, ease: "power2.out", stagger: 0.18 },
        0.34
      );
      tl.fromTo(
        "#s1-statement",
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" },
        1.5
      );
      /* Hard cut to Scene 2: its opaque full-bleed slice covers this scene from 2.8s. */

      /* ── Scene 2 — The section (real page) ──────────────── */
      tl.fromTo("#s2-shot-wrap", { scale: 1 }, { scale: 1.05, duration: 5.2, ease: "none" }, 3);
      tl.fromTo(
        "#s2-caption",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        4
      );
      tl.fromTo(
        "#s2-inner",
        { opacity: 1 },
        { opacity: 0, duration: 0.4, ease: "none", immediateRender: false },
        7.8
      );

      /* ── Scene 3 — The voice ────────────────────────────── */
      tl.fromTo("#s3-inner", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 7.9);
      // natural timing (coincides with the beat grid, not a formal lock)
      tl.fromTo(
        "#s3-quote1",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" },
        8.7
      );
      tl.fromTo(
        "#s3-quote2",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" },
        9.9
      );
      tl.fromTo(
        "#s3-quote1",
        { opacity: 1 },
        { opacity: 0, duration: 0.35, ease: "none", immediateRender: false },
        10.5
      );
      tl.fromTo(
        "#s3-quote2",
        { opacity: 1 },
        { opacity: 0, duration: 0.35, ease: "none", immediateRender: false },
        10.5
      );
      tl.fromTo("#s3-card1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 10.9);
      tl.fromTo(
        "#s3-card1-wrap",
        { scale: 1.06 },
        { scale: 1, duration: 2.1, ease: "none", immediateRender: false },
        10.9
      );
      tl.fromTo(
        "#s3-card1-wrap",
        { opacity: 1 },
        { opacity: 0, duration: 0.25, ease: "none", immediateRender: false },
        12.85
      );
      tl.fromTo("#s3-card2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 13.1);
      tl.fromTo(
        "#s3-card2-wrap",
        { scale: 1 },
        { scale: 1.04, duration: 2.2, ease: "none", immediateRender: false },
        13.1
      );
      tl.fromTo(
        "#s3-inner",
        { opacity: 1 },
        { opacity: 0, duration: 0.4, ease: "none", immediateRender: false },
        15.3
      );

      /* ── Scene 4 — Punchline ────────────────────────────── */
      tl.fromTo("#s4-inner", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 15.4);
      tl.fromTo(
        "#s4-kicker",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        15.9
      );
      tl.fromTo(
        "#s4-kicker",
        { opacity: 1 },
        { opacity: 0, duration: 0.2, ease: "none", immediateRender: false },
        17.2
      );
      // beat-locked: 17.47s (strong cue)
      tl.fromTo(
        "#s4-line1",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
        17.47
      );
      // beat-locked: 18.56s (strong cue)
      tl.fromTo(
        "#s4-line2",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
        18.56
      );
      tl.fromTo(
        "#s4-line1",
        { opacity: 1 },
        { opacity: 0, duration: 0.2, ease: "none", immediateRender: false },
        19.45
      );
      tl.fromTo(
        "#s4-line2",
        { opacity: 1 },
        { opacity: 0, duration: 0.2, ease: "none", immediateRender: false },
        19.45
      );
      // beat-locked: 19.66s (strong cue) — logo lockup lands
      tl.fromTo(
        "#s4-mark",
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" },
        19.66
      );
      tl.fromTo(
        "#s4-name",
        { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
        19.8
      );
      tl.fromTo("#s4-url", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 20);
      tl.fromTo("#s4-pill", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 20.1);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
