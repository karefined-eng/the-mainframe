    <rect x="252" y="0" width="222" height="54" rx="10" fill="none" stroke="#1F2024" stroke-width="2"/>
    <text x="363" y="34" fill="#F2F2F0" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">View on GitHub</text>
  </g>
  <text x="88" y="566" fill="#B1B3B7" font-family="Inter, system-ui, sans-serif" font-size="19">Early public release · no account · offline SQLite storage · Tauri v2, Rust, React</text>
