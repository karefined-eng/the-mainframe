<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="The Mainframe — local-first life management">
  <rect width="1200" height="630" fill="#0E0E10"/>
  <g transform="translate(88, 84)">
    <rect x="0" y="0" width="58" height="10" rx="5" fill="#F2F2F0"/>
    <rect x="0" y="18" width="58" height="10" rx="5" fill="#4A9EFF"/>
    <rect x="0" y="36" width="58" height="10" rx="5" fill="#F2F2F0"/>
  </g>
  <text x="88" y="212" fill="#B1B3B7" font-family="Inter, system-ui, sans-serif" font-size="22" letter-spacing="3">THE MAINFRAME</text>
  <text x="88" y="300" fill="#F2F2F0" font-family="Inter, system-ui, sans-serif" font-size="60" font-weight="700">Local-first life management.</text>
  <text x="88" y="368" fill="#B1B3B7" font-family="Inter, system-ui, sans-serif" font-size="27">One dashboard for the work, learning, ideas, goals,</text>
  <text x="88" y="406" fill="#B1B3B7" font-family="Inter, system-ui, sans-serif" font-size="27">and purchases already spread across your devices.</text>
